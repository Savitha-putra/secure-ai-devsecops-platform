name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Syntax check
        run: |
          python -m compileall app

      - name: Docker build
        run: |
          docker build \
            -t secure-ai-devsecops-platform:${{ github.sha }} .
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner | lower }}/secure-ai-devsecops-platform:${{ github.sha }} .

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner | lower }}/secure-ai-devsecops-platform:${{ github.sha }}