name: Gitleaks Secret Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Gitleaks version
        run: |
          docker run --rm zricethezav/gitleaks:v8.18.4 version

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/leaks.json \
            --redact \
            --exit-code=1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: leaks.json
